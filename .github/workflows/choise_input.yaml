name: To check the choise input

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose Environmet"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Select The ENV
        run: echo "Deploying to ${{ inputs.environment }}"  
